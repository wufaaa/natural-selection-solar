name: Build Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish, for example v4.2.0'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run desktop:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalSelectionSolar-Windows-x64
          if-no-files-found: error
          path: |
            release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run desktop:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalSelectionSolar-macOS
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/NaturalSelectionSolar-Windows-x64/*.exe
            artifacts/NaturalSelectionSolar-macOS/*.dmg
            artifacts/NaturalSelectionSolar-macOS/*.zip
